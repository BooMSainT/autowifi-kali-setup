name: Hardware bridge checks

on:
  push:
    paths:
      - "extensions/hardware_bridge.py"
      - "extensions/deauther_bridge.py"
      - "extensions/deauther_console.py"
      - "extensions/autowifi_operator.py"
      - "extensions/simple_menu.py"
      - "extensions/autopilot.py"
      - "extensions/lan_inventory.py"
      - "extensions/network_inventory.py"
      - "extensions/quick_scan.py"
      - "extensions/bomb_simulation.py"
      - "setup-ai.sh"
      - "setup-hardware.sh"
      - "setup-deauther.sh"
      - "setup-menu.sh"
      - "tests/**"
      - ".github/workflows/hardware-checks.yml"
  pull_request:
    paths:
      - "extensions/hardware_bridge.py"
      - "extensions/deauther_bridge.py"
      - "extensions/deauther_console.py"
      - "extensions/autowifi_operator.py"
      - "extensions/simple_menu.py"
      - "extensions/autopilot.py"
      - "extensions/lan_inventory.py"
      - "extensions/network_inventory.py"
      - "extensions/quick_scan.py"
      - "extensions/bomb_simulation.py"
      - "setup-ai.sh"
      - "setup-hardware.sh"
      - "setup-deauther.sh"
      - "setup-menu.sh"
      - "tests/**"
      - ".github/workflows/hardware-checks.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          python3 -m py_compile extensions/hardware_bridge.py extensions/deauther_bridge.py extensions/deauther_console.py extensions/autowifi_operator.py extensions/simple_menu.py extensions/autopilot.py extensions/lan_inventory.py extensions/quick_scan.py extensions/bomb_simulation.py
          bash -n setup-ai.sh setup-hardware.sh setup-deauther.sh setup-menu.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
