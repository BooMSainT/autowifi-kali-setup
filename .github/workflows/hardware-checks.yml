name: Hardware bridge checks

on:
  push:
    paths:
      - "extensions/hardware_bridge.py"
      - "extensions/deauther_bridge.py"
      - "extensions/autowifi_operator.py"
      - "setup-ai.sh"
      - "setup-hardware.sh"
      - "setup-deauther.sh"
      - "tests/**"
      - ".github/workflows/hardware-checks.yml"
  pull_request:
    paths:
      - "extensions/hardware_bridge.py"
      - "extensions/deauther_bridge.py"
      - "extensions/autowifi_operator.py"
      - "setup-ai.sh"
      - "setup-hardware.sh"
      - "setup-deauther.sh"
      - "tests/**"
      - ".github/workflows/hardware-checks.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          python3 -m py_compile extensions/hardware_bridge.py extensions/deauther_bridge.py extensions/autowifi_operator.py
          bash -n setup-ai.sh setup-hardware.sh setup-deauther.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
